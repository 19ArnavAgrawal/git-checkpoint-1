<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Checkpoint 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #24292f;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #24292f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Git Checkpoint 1</h1>

        <p>This project demonstrates Git Fundamentals.</p>

        <p>
          github basics
        </p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
        <p>Feature branch work</p>
        
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Git Checkpoint 1 Completed!";
        }
    </script>

</body>
</html>
